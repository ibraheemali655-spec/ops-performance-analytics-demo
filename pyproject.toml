[project]
name = "ops-performance-analytics-demo"
version = "0.1.0"
description = "Synthetic XTRF-style data generator and offline ETL demo (standard library only)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
